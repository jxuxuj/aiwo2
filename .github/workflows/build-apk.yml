name: Build DSH Go APK (debug arm64)

# Self-hosted fork build: manual trigger only.
# Debug flavor skips the bundled proot runtime, so this is much lighter than a release build.
# The APK is also published to a rolling release so it can be downloaded fast.

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Version name, e.g. 1.1.0-aiwo.1'
        required: false
        default: '1.1.0-aiwo.1'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/system-images 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Write android/local.properties
        working-directory: app
        run: |
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Build debug APK
        working-directory: app
        run: |
          flutter build apk --debug --flavor arm64 \
            --target-platform android-arm64 \
            --build-name "${{ inputs.build_name }}"

      - name: Verify signing certificate
        run: |
          APK=app/build/app/outputs/flutter-apk/app-arm64-debug.apk
          APKSIGNER=$(ls -1d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK" | head -n 6

      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=aiwo-latest
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "AIwo build" --notes "Automatic build of the AIwo fork." --latest=false
          cp app/build/app/outputs/flutter-apk/app-arm64-debug.apk "aiwo-${{ inputs.build_name }}-arm64.apk"
          gh release upload "$TAG" "aiwo-${{ inputs.build_name }}-arm64.apk" --clobber
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/aiwo-${{ inputs.build_name }}-arm64.apk"


