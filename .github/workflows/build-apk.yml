name: Build AIwo APK (release arm64)

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Version name, e.g. 1.2.0-aiwo.21'
        required: false
        default: '1.2.0-aiwo.21'

permissions:
  contents: write

env:
  BUILD_NAME: ${{ inputs.build_name }}
  APK: app/build/app/outputs/flutter-apk/app-arm64-release.apk

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/system-images 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Stage the matching DSH Go 1.2.0 Ubuntu runtime
        run: |
          upstream_apk="$RUNNER_TEMP/dsh-go-1.2.0-arm64.apk"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$upstream_apk" \
            'https://github.com/ccch1mneyyy/dsh-Go/releases/download/v1.2.0/dsh-go-1.2.0-arm64.apk'
          echo "40c2d2612533f28fef2c0bb4acf3cb80d6d45bfede405c21e73dcce613aed718  $upstream_apk" | sha256sum -c -
          python3 tooling/stage_aiwo_android_runtime.py "$upstream_apk"

      - name: Build release APK
        working-directory: app
        run: |
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
          flutter build apk --release --flavor arm64 \
            --target-platform android-arm64 \
            --build-name "$BUILD_NAME"

      - name: Verify package and version
        run: |
          AAPT=$(ls -1d "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" > apk-badging.txt
          grep '^package:' apk-badging.txt | grep -F "name='com.aiwo.dsh'" | grep -F "versionName='$BUILD_NAME'"
          python3 tooling/stage_aiwo_android_runtime.py "$APK"

      - name: Stage unsigned APK for local signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="aiwo-$BUILD_NAME-arm64-unsigned.apk"
          cp "$APK" "$asset"
          gh release create "aiwo-signing-$GITHUB_RUN_ID" "$asset" --draft --target "$GITHUB_SHA" \
            --title "AIwo unsigned build $GITHUB_RUN_ID" --notes 'Temporary artifact for local signing.'
